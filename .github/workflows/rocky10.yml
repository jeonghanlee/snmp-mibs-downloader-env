---
name: Rocky10

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '*.md'

  pull_request:
    branches: [ master ]

jobs:
  Rocky10:
    runs-on: ubuntu-latest
    container: rockylinux/rockylinux:10.2
    steps:
    - uses: actions/checkout@v3
    - name: Install required packages
      run: |
        dnf install -y git make sudo tree net-snmp patch which python3
    - name: Setup
      run: |
        make init
        make install
        make get
    - name: Environment Check
      run: |
        make mibs.installed.check
        make exist
        make list
    - name: Reinstall Check
      run: |
        make install
        make get
        make mibs.installed.check
